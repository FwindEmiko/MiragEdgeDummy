# ============================================================
# 训练假人 MiragEdgeDummy 消息文件
# 颜色代码使用 & 前缀，{占位符} 运行时替换
# 全部中文，禁 emoji（基岩版渲染为乱码）
# ============================================================

# 训练假人物品的显示名与说明
item:
  name: "&6训练假人"
  lore:
    - "&7右键地面放置一个训练假人"
    - "&7训练假人可以穿上护甲，测出真实伤害"
    - "&7空手右键可取下装备"
    - "&7潜行右键训练假人可收回"

# 消息区
messages:
  # 全局前缀（自动加在所有消息前）
  global-prefix: "&7[&b训练假人&7]"

  # 每次命中显示（{damage}=伤害数值, {hearts}=对应心数）
  # 例外：伤害读数不加全局前缀（ActionBar 高频刷新，短文案更清爽，与 F2 示例一致）
  # ❤ 为 U+2764（重黑心），基岩版默认字体原生支持、Geyser 可正常显示，属允许的白名单符号
  damage: "&f伤害: &c{damage} &f(&c{hearts} ❤&f)"

  # 放置 / 收回
  placed: "&7&o已放置训练假人"
  removed: "&7&o已收回训练假人"
  not-owner: "&7&o这个训练假人不是你的（主人: {owner}），不能操作"

  # 装备相关
  equipped: "&7&o已装备 {item}"
  retrieved: "&7&o已取下 {item}"

  # 命令相关
  no-permission: "&7&o你没有权限这样做"
  invalid-usage: "&c用法: /dummy give <玩家> <数量> | /dummy reload | /dummy list | /dummy remove <uuid> | /dummy info <uuid>"
  invalid-amount: "&7&o数量必须是正整数"
  player-not-found: "&7&o找不到该玩家"
  gave-item: "&7&o已给 {player} {amount} 个训练假人"
  received-item: "&7&o你获得了 {amount} 个训练假人"
  reload-success: "&a配置已重载"
  list-header: "&e现存训练假人: {count} 个"
  list-item: "&7- &e{id} &7主人=&e{owner} &7世界=&e{world}"
  no-such-npc: "&7&o没有找到 id 为 {id} 的训练假人"
  info-header: "&e训练假人 {id} 信息:"
  remove-success: "&a已删除训练假人 {id}"
  remove-failed: "&c删除训练假人 {id} 失败"

  # 新增键（命令/监听器使用）
  nothing-to-take: "&7&o训练假人没有穿戴装备"
  sneak-to-remove: "&7&o潜行右键可收回训练假人"
  placement-failed: "&7&o这里无法放置训练假人"
  invalid-uuid: "&7&o无效的训练假人ID，应为UUID格式"
  inventory-full: "&7&o背包已满，多余物品已掉落在原地"
  info-owner: "&7&o主人: {owner}"
  info-world: "&7&o世界: {world}"
  info-location: "&7&o位置: {x}, {y}, {z}"
  info-facing: "&7&o朝向: {yaw}° / {pitch}°"