# ============================================================
# 训练假人 MiragEdgeDummy 配置
# 修改后执行 /dummy reload 生效
# ============================================================

# 训练假人物品使用的材质（任意 Bukkit 材质名）
item:
  material: ARMOR_STAND

# 通知设置
notifications:
  # 伤害数值保留的小数位数
  precision: 1
  # 伤害结果显示方式：actionbar（推荐，基岩版兼容）或 chat
  mode: actionbar
  # 命中读数是否附带 CPS（每秒攻击次数，最近 1 秒滑动窗口）
  show-cps: true
  # 攻击未蓄满力时，命中读数是否附带蓄力百分比（直观展示冷却对伤害的影响）
  show-cooldown: true

# 假人底层实体类型：
#   player（默认）—— 真实玩家 NPC（真 Player 实体，有皮肤/身体/装备显示；不在玩家列表/不占 Tab/不被存档）。
#                    需要服务端 NMS 反射支持（Paper/Leaf 26.2 已验证思路）；生成失败自动回退 armor-stand。
#   armor-stand  —— 传统盔甲架 + 皮肤头颅
dummy-entity-type: player

# 假人默认最大生命值（/dummy give 未指定 [生命] 时使用；物品带 hp 时以物品为准）。
# 假人可被玩家击杀，击杀后立即在原位置满血重生（装备/皮肤保留）。
dummy-default-hp: 100

# 训练假人显示名（支持 & 颜色代码）
npc-name: "&e训练假人"

# 是否显示名字（悬浮标签）
npc-name-visible: true

# 假人皮肤：填玩家名时为假人装备对应玩家的皮肤头颅（占用头盔槽，之后无法再装备头盔类物品）。
# 留空（""）则不启用。皮肤解析：优先使用已缓存的离线配置，缺失时异步向 Mojang/皮肤系统解析，
# 对接服务器现有的离线皮肤系统（如 skinsrestorer 等挂接 PlayerProfile 的插件可自动生效）。
npc-skin: "FwindEmi"

# 是否需要潜行右键才能拾取训练假人
removal:
  require-sneak: true

# 保留兼容：编辑（穿/取装备、收回）已统一改为【管理员权限 miragedgedummy.admin】门禁，
# 普通玩家在 PVP 大厅只能攻击练手、不能改动假人。此键不再影响交互权限。
allow-non-owners-break: true

# 调试模式（生产环境保持 false）
debug: false
