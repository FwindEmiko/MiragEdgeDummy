name: MiragEdgeDummy
version: '1.2.1'
main: top.miragedge.dummy.MiragEdgeDummy
api-version: '1.21'
prefix: 训练假人
authors: [ FCelestial, FwindEmiko ]
description: MiragEdgeDummy 训练假人——打桩测伤，护甲附魔全验证

commands:
  dummy:
    description: 训练假人管理命令
    usage: /dummy give <玩家> <数量> [生命] | /dummy reload | /dummy list | /dummy remove <uuid> | /dummy info <uuid>
    aliases: [ 训练假人, dummies ]
    # 权限由各子命令内部校验：miragedgedummy.give / .reload / .admin（见下方 permissions）

permissions:
  miragedgedummy.give:
    description: 给予训练假人物品
    default: op
  miragedgedummy.reload:
    description: 重载插件配置与消息
    default: op
  miragedgedummy.admin:
    description: 管理命令（list/remove/info）与编辑训练假人装备（穿/取/收回，PVP 大厅仅管理员可编辑）
    default: op

softdepend: [ PlaceholderAPI ]
loadafter: [ PlaceholderAPI ]
